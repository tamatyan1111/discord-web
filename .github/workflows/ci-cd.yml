name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 技術要素が決まったら、lint・型チェック・テスト・ビルドのステップに置き換える
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Placeholder
        run: echo "CIの中身は技術要素が決まってから追加する"

  # productionに必須の承認者を設定し、承認するまで環境シークレットが渡らないようにする
  deploy:
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Placeholder
        run: echo "デプロイ先が決まったらここに追加する"
